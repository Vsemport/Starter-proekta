# Ревью PR силами Claude Code по официальному примеру anthropics/claude-code-action.
# Выключено по умолчанию. Чтобы включить в своём репозитории:
#   1. Добавь секрет ANTHROPIC_API_KEY (Settings → Secrets → Actions) или настрой приложение через /install-github-app.
#   2. Создай переменную репозитория CLAUDE_REVIEW со значением true:  gh variable set CLAUDE_REVIEW --body true
# Без переменной задача пропускается и ничего не стоит.
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: ${{ vars.CLAUDE_REVIEW == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
